services:
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./kingei-rust
    environment:
      DATABASE_URL: sqlite:///data/chat.db
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_PUBLIC_ENDPOINT: ${GARAGE_PUBLIC_ENDPOINT}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
      GARAGE_REGION: ${GARAGE_REGION:-us-east-1}
      RUST_LOG: info
    volumes:
      - api-data:/data
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./kingei-nuxt
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "3000:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      garage:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  garage-meta:
  garage-data:
